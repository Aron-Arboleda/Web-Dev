<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOB - PC Troubleshooting Assistant</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
      <h1 class="text-3xl font-bold text-center text-indigo-700 mb-8">
        BOB: PC Assistant
      </h1>

      <!-- Main content area -->
      <div
        class="max-w-4xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6"
      >
        <div class="text-center mb-8">
          <i data-feather="cpu" class="w-16 h-16 mx-auto text-indigo-500"></i>
          <h2 class="text-2xl font-semibold text-gray-800 mt-4">
            Need help with your computer?
          </h2>
          <p class="text-gray-600 mt-2">
            Click the chat button below to get started!
          </p>
        </div>

        <!-- Chatbot trigger button -->
        <div class="fixed bottom-8 right-8">
          <button
            id="chatbot-toggle"
            class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-full p-4 shadow-lg transition-all duration-300 transform hover:scale-110"
          >
            <i data-feather="message-circle" class="w-6 h-6"></i>
          </button>
        </div>

        <!-- Chatbot popup -->
        <div
          id="chatbot-popup"
          class="hidden fixed bottom-24 right-8 w-80 bg-white rounded-xl shadow-xl border border-gray-200 overflow-hidden"
        >
          <div
            class="bg-indigo-600 text-white p-4 flex justify-between items-center"
          >
            <h3 class="font-semibold">BOB Assistant</h3>
            <button id="chatbot-close" class="text-white hover:text-indigo-200">
              <i data-feather="x" class="w-5 h-5"></i>
            </button>
          </div>

          <div id="chatbot-messages" class="h-64 overflow-y-auto p-4 space-y-3">
            <div class="bg-indigo-100 text-indigo-800 rounded-lg p-3 max-w-xs">
              <p>
                Hi there! I'm BOB, your PC troubleshooting assistant. What seems
                to be the problem?
              </p>
            </div>
          </div>

          <div class="border-t border-gray-200 p-3">
            <div class="flex space-x-2">
              <input
                id="chatbot-input"
                type="text"
                placeholder="Type your issue..."
                class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />
              <button
                id="chatbot-send"
                class="bg-indigo-600 text-white rounded-lg px-4 py-2 hover:bg-indigo-700"
              >
                <i data-feather="send" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="mt-2 grid grid-cols-2 gap-2">
              <button
                class="quick-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-1 px-2 rounded"
              >
                Slow performance
              </button>
              <button
                class="quick-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-1 px-2 rounded"
              >
                Internet issues
              </button>
              <button
                class="quick-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-1 px-2 rounded"
              >
                Blue screen
              </button>
              <button
                class="quick-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-1 px-2 rounded"
              >
                Virus concerns
              </button>
              <button
                class="quick-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-1 px-2 rounded"
              >
                No power
              </button>
              <button
                class="quick-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-1 px-2 rounded"
              >
                Black screen
              </button>
              <button
                class="quick-btn bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs py-1 px-2 rounded col-span-2"
              >
                Random shutdown / Overheating
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
    <script>
      feather.replace();
    </script>
  </body>
</html>
