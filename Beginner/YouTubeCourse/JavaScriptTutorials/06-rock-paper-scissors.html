      }

      let result1 = ''

        result1 = `Parehas kayo`;

        result1 = `Talo ka gaga`;
      } else if (computerChoice1 === 'scissors'){
        result1 = `Mega kill, u slayed`;
      }
      alert(`You picked rock and the computer picked ${computerChoice1}, ${result1}`);

    ">Rock</button>
