    <script>
      // Exercise: 11a
      const nums = [10, 20, 30];
      nums[2] = 99;

      // Exercise: 11b
      function getLastValue(array) {
        return array[array.length - 1];
      }

      // Exercise: 11c
      function arraySwap(array) {
        const first = array[0];
        const last = getLastValue(array);
        array[0] = last;
        array[array.length - 1] = first;
        return array;
      }

      console.log(arraySwap([1, 20, 22, 24, 51]));

      // Exercise: 11d
      console.log("Counts up by two:");
      for (let i = 0; i <= 10; i += 2) {
        console.log(i);
      }

      // Exercise: 11e
      console.log("Counts down from 5 to 0");
      for (let i = 5; i >= 0; i--) {
        console.log(i);
      }

      // Exercise: 11f
      console.log("\n Using While Loops");
      console.log("Counts up by two:");
      let i = 0;
      while (i <= 10) {
        console.log(i);
        i += 2;
      }

      console.log("Counts down from 5 to 0");
      let j = 5;
      while (j >= 0) {
        console.log(j);
        j--;
      }

      // Exercise: 11g
      let arrayNums = [1, 2, 3];
      let arrayNumsAdded1 = [];
      for (let i = 0; i < arrayNums.length; i++) {
        arrayNumsAdded1[i] = arrayNums[i] + 1;

      // Exercise: 11h
      function addOne(array) {
        let arrayNumsAdded1 = [];
        for (let i = 0; i < arrayNums.length; i++) {
          arrayNumsAdded1[i] = arrayNums[i] + 1;
        }
        return arrayNumsAdded1;
      }

      console.log(addOne(arrayNums));

      // Exercise: 11i
      function addNum(array, num) {
        let arrayNumsAdded1 = [];
        for (let i = 0; i < arrayNums.length; i++) {
          arrayNumsAdded1[i] = arrayNums[i] + num;
        }
        return arrayNumsAdded1;
      }

      console.log(addNum([1, 2, 3], 2));
      console.log(addNum([1, 2, 3], 3));

      // Exercise: 11j
      function addArrays(array1, array2) {
        let summedUpArray = [];
        for (let i = 0; i < array1.length; i++) {
          summedUpArray[i] = array1[i] + array2[i];
        }
        return summedUpArray;
      }

      console.log(addArrays([1, 1, 2], [1, 1, 3]));

      // Exercise: 11k
      function countPositive(nums) {
        let count = 0;
        for (let i = 0; i < nums.length; i++) {
          if (nums[i] > 0) {
            count++;
          }
        }
        return count;
      }

      console.log(countPositive([1, -3, 5]));

      // Exercise: 11l, 11m
      function minMax(nums) {
        let min;
        let max;
        if (nums.length > 0) {
          min = nums[0];
          max = nums[0];
          for (let i = 0; i < nums.length; i++) {
            if (nums[i] < min) {
              min = nums[i];
            } else if (nums[i] > max) {
              max = nums[i];
            }
          }
          return { min, max };
        } else {
          return { min: null, max: null };
        }
      }

      console.log(minMax([1, -3, 5]));
      console.log(minMax([-2, 3, -5, 7, 10]));
      console.log(minMax([]));
      console.log(minMax([3]));

      // Exercise: 11n
      function countWords(words) {
        const listObject = {};
        //const uniquenessList = [];
        // listObject["apple"];
        for (let i = 0; i < words.length; i++) {
          if (listObject.hasOwnProperty(words[i])) {
            listObject[words[i]] += 1;
          } else {
            listObject[words[i]] = 1;
          }
        }
        return listObject;
      }

      console.log(countWords(["apple", "grape", "apple", "apple"]));

      // Exercise: 11o, 11p

        if (string[i] === "search") {
          index = i;
          break;
        }
      }
      console.log(index);

      // Exercise: 11q
      function findIndex(array, word) {
        let index = -1;
        for (let i = 0; i < array.length; i++) {
          if (array[i] === word) {
            index = i;
            break;
          }
        }
        return index;
      }

      console.log(findIndex(["green", "red", "blue", "red"], "red"));
      console.log(findIndex(["green", "red", "blue", "red"], "yellow"));

      // Exercise: 11r, 11s, 11t
      function removeEgg(foods) {
        foods = foods.reverse();
        let eggCounter = 0;
        const output = [];
        for (let i = 0; i < foods.length; i++) {
          if (foods[i] === "egg") {
            eggCounter++;
            if (eggCounter > 2) {
              output.push(foods[i]);
            }
            continue;
          } else {
            output.push(foods[i]);
          }
        }
        return output.reverse();
      }

      const foods = ["egg", "apple", "egg", "egg", "ham"];
      console.log(removeEgg(foods.slice()));
      console.log(foods);

      // Exercise: 11v
      for (let i = 1; i <= 20; i++) {
        if (i % 3 == 0 && i % 5 == 0) {
          console.log("FizzBuzz");
        } else if (i % 3 == 0) {
          console.log("Fizz");
        } else if (i % 5 == 0) {
          console.log("Buzz");
        } else {
          console.log(i);
        }
      }

      // Exercise: 11w
      function unique(array) {
        const uniqueArray = [];
        for (let i = 0; i < array.length; i++) {
          if (findIndex(array, array[i]) == i) {
            uniqueArray.push(array[i]);
          }
        }
        return uniqueArray;
      }

      console.log(unique(["green", "red", "blue", "red"]));
      console.log(unique(["red", "green", "green", "red"]));
