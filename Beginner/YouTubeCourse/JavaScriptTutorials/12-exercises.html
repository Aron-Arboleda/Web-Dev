<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advance Functions (12) Exercises:</title>
  </head>
  <body>
    <!-- Exercise: 12c -->
    <button class="start-button">Start</button>
    <br><br>
    <!-- Exercise: 12e -->
    <button class="add-to-cart-button">Add to cart</button>
    <p class="added-info"></p>

    <p>Document Title:</p>
    <button class="add-button">Add</button>

    <button class="remove-button">Remove</button>

    <script>
      // Exercise: 12a
      const add = function () {
        console.log(2 + 3);
      }

      // Exercise: 12b
      function runTwice(fun) {
        fun();
        fun();
      }

      runTwice(add);

      // Exercise: 12c, 12d
      const buttonElement = document.querySelector('.start-button');
      buttonElement.addEventListener('click', () => {
        start();
      });

      function start() {
        buttonElement.innerText = 'Loading...';
        setTimeout(() => {
          buttonElement.innerText = 'Finished!';
        },1000)
      }

      // Exercise: 12e, 12f

      const addToCartButtonElement = document.querySelector('.add-to-cart-button');
      addToCartButtonElement.addEventListener('click', () => {
        addToCart();
      })

      let clicked = false;
      let timeoutId;
      function addToCart() {
        if (clicked == true){
          clearTimeout(timeoutId);
        }
        const infoElement = document.querySelector('.added-info');
        infoElement.innerHTML = 'Added';
        clicked = true;
        setTimeout(() => {
          infoElement.innerHTML = '';
        },2000)
      }

      // Exercise: 12g, 12h, 12i
      document.title = 'App';
      const addButton = document.querySelector('.add-button');
      addButton.addEventListener('click', () => {
        messages++;
        if (messages === 1){
          playChangingTitle();
        }
      })
      const removeButton = document.querySelector('.remove-button');
      removeButton.addEventListener('click', () => {
        if (messages > 0){
          messages--;
          if (messages === 0){
            document.title = 'App'
            clearInterval(intervalId);
          }
        }
      })
      

      let messages = 2;
      let intervalId;
      function playChangingTitle() {
        let changingTitle = false;
        intervalId = setInterval(() => {
          document.title = changingTitle ? 'App' : `(${messages}) New messages`;
          changingTitle = !changingTitle;
        }, 1000);
      }
      
      playChangingTitle();

      // Exercise: 12j, 12k
      const multiply = (x, y) => x * y; 
      console.log(multiply(2,3));

      // Exercise: 12l
      function countPositive(nums) {
        let count = 0;
        nums.forEach(value => {
          if (value > 0) count++;
        });
        return count;
      }

      console.log(countPositive([1,-3,5]));

      // Exercise: 12m
      function addNum(array, num) {
        return array.map(x => x + num);
      }
      console.log(addNum([1,2,3], 2));

      // Exercise: 12n, 12o
      
      function removeEgg(foods) {
        let count = 0;
        return foods.filter((value, i) => {
          if (value === 'egg'){
            count++;
            if (count > 2){
              return true;
            }
          } else {
            return true;
          }
        });
      }
      console.log(removeEgg(['egg','apple', 'egg', 'egg', 'ham']));

    </script>
  </body>
</html>
