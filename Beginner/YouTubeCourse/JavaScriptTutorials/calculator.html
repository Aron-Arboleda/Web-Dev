<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
  </head>

  <link rel="stylesheet" href="calculator-resources/styles/calculator.css">
  <body>
    <p>Simple Arithmetic Calculator</p>

    <p class="js-text"></p>

    <button onclick="
      updateCalculation('1');
    " class="calculator-button gray">1</button>

    <button onclick="
      updateCalculation('2');
    " class="calculator-button gray">2</button>

    <button onclick="
      updateCalculation('3');
    " class="calculator-button gray">3</button>

    <button onclick="
      updateCalculation(' + ');
    " class="calculator-button orange">+</button>

    <br><br>

    <button onclick="
      updateCalculation('4');
    " class="calculator-button gray">4</button>

    <button onclick="
      updateCalculation('5');
    " class="calculator-button gray">5</button>

    <button onclick="
      updateCalculation('6');
    " class="calculator-button gray">6</button>

    <button onclick="
      updateCalculation(' - ');
    " class="calculator-button orange">-</button>

    <br><br>

    <button onclick="
      updateCalculation('7');
    " class="calculator-button gray">7</button>

    <button onclick="
      updateCalculation('8');
    " class="calculator-button gray">8</button>

    <button onclick="
      updateCalculation('9');
    " class="calculator-button gray">9</button>

    <button onclick="
      updateCalculation(' * ');
    " class="calculator-button orange">*</button>

    <br><br>

    <button onclick="
      updateCalculation('0');
    " class="calculator-button gray">0</button>

    <button onclick="
      updateCalculation('.');
    " class="calculator-button gray">.</button>

    <button onclick="
      let result = eval(calculation);
      console.log(result);
      calculation = result;
      localStorage.setItem('calculation', calculation);
      updateText();
    " class="calculator-button gray">=</button>

    <button onclick="
      updateCalculation(' / ');
    " class="calculator-button orange">/</button>

    <br><br>

    <button onclick="
      resetCalculation();
    " class="calculator-button gray clear-button">Clear</button>

    <script src="calculator-resources/scripts/calculator.js"></script>
  </body>
</html>
