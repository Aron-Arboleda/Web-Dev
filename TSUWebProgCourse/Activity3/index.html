<!DOCTYPE html>
<html>
  <head>
    <title>Document</title>
  </head>
  <style>
    body {
      background: linear-gradient(
        90deg,
        rgb(71, 71, 223) 10%,
        rgb(29, 235, 152) 100%
      );
      font-family: "Segoe UI";
      display: flex;
      justify-content: center;
      padding: 20px;
      background-color: aqua;
    }
    h1 {
      text-align: center;
      color: #025dbe;
    }
    form {
      width: 30%;
      height: 500px;
      text-align: center;
      padding: 40px;
      margin: 40px 0px;
      background-color: white;
      border-radius: 10px;
    }
    
    input[type="text"] {
      border: none;
      border-bottom: 2px solid #007BFF;
      padding: 10px 0px;
      font-size: 16px;
      width: 100%;
      outline: none;
      margin-bottom: 10px;
    }

    #inputsDiv {
      margin: 80px 10px;
    }
    
    input[type="submit"] {
      color: white;
      background: linear-gradient(
        90deg,
        rgb(71, 71, 223) 10%,
        rgb(29, 235, 152) 100%
      );
      border: none;
      border-radius: 25px;
      width: 300px;
      height: 50px;
      font-size: 20px;
    }
  </style>
  <body>
    
    <form action="" method="GET|POST">
      <h1>Sign Up</h1>
      <div id="inputsDiv">
        <input type="text" name="name" placeholder="Name" /> <br />
        <input type="text" name="age" placeholder="Age" /> <br />
        <input type="text" name="age" placeholder="Address" /> <br /> 
      </div>      
      <input type="submit">
    </form>
  </body>
</html>
