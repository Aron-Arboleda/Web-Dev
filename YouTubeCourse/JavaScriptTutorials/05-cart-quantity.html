<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart Quantity</title>

  </head>
  <body>
    <button onclick="
      showQuantity();
      ">Show Quantity</button>

    <button onclick="
      add(1);
    ">Add to Cart</button>

    <button onclick="
      minus(1);
    ">Remove from Cart</button>

    <button onclick="
      add(2);
    ">+2</button>

    <button onclick="
      add(3);
    ">+3</button>

    <button onclick="
      add(4);
    ">+4</button>

    <button onclick="
      add(5);
    ">+5</button>

    <button onclick="
      resetCart();
    ">Reset Cart</button>
    
    <button onclick="
      minus(2);
    ">-2</button>

    <button onclick="
      minus(3);
    ">-3</button>

    <script>
      let cartQuantity = 0;
      var maxQuantity = 10;
      function showQuantity(){
        console.log(`Cart quantity: ${cartQuantity}`);
      }
      function add(quantityToAdd){
        if ((cartQuantity + quantityToAdd) > maxQuantity){
          console.log(`-----------Can't add more items. Cart is Full.----------`);
          showQuantity();
        } else {
          cartQuantity += quantityToAdd;
          showQuantity();
        }
      }
      function minus(quantityToMinus){
        if ((cartQuantity - quantityToMinus) < 0){
          console.log(`-----------No items in the cart. Cart is Empty.----------`);
          showQuantity();
        } else {
          cartQuantity -= quantityToMinus;
          showQuantity();
        }
      }
      function resetCart(){
        cartQuantity = 0;
        console.log('Cart was reset.');
        showQuantity();
      }
    </script>
  </body>
</html>
