<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors-resources/styles/10-rock-paper-scissors.css">
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button
      onclick="
      playGame('rock');
    " class="move-button"
    ><img src="rock-paper-scissors-resources/images/rock-emoji.png" alt="rock hand image" class="move-icon">
      
    </button>

    <button
      onclick="
      playGame('paper');
    " class="move-button"
    >
    <img src="rock-paper-scissors-resources/images/paper-emoji.png" alt="paper hand image" class="move-icon">
    </button>

    <button
      onclick="
      playGame('scissors');
    " class="move-button"
    >
    <img src="rock-paper-scissors-resources/images/scissors-emoji.png" alt="scissors hand image" class="move-icon">
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button
      onclick="
      score.wins = 0;
      score.losses = 0;
      score.ties = 0;
      localStorage.removeItem('score');

      updateScoreElement();
    " class="reset-score-button"
    >
      Reset Score
    </button>

    <script src="rock-paper-scissors-resources/scripts/10-rock-paper-scissors.js"></script>
  </body>
</html>
