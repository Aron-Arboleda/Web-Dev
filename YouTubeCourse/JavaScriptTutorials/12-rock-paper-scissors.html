<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link
      rel="stylesheet"
      href="rock-paper-scissors-resources/styles/12-rock-paper-scissors.css"
    />
  </head>
  <body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button">
      <img
        src="rock-paper-scissors-resources/images/rock-emoji.png"
        alt="rock hand image"
        class="move-icon"
      />
    </button>

    <button class="move-button js-paper-button">
      <img
        src="rock-paper-scissors-resources/images/paper-emoji.png"
        alt="paper hand image"
        class="move-icon"
      />
    </button>

    <button class="move-button js-scissors-button">
      <img
        src="rock-paper-scissors-resources/images/scissors-emoji.png"
        alt="scissors hand image"
        class="move-icon"
      />
    </button>

    <p class="js-result result"></p>
    <p class="js-moves"></p>
    <p class="js-score score"></p>

    <button class="reset-score-button">
      Reset Score
    </button>

    <button class="auto-play-button">
      Auto Play
    </button>
    <br><br>
    <div class="confirmation-message"></div>

    <script src="rock-paper-scissors-resources/scripts/12-rock-paper-scissors.js"></script>
  </body>
</html>
